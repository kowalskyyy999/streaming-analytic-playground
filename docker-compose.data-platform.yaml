version: '3.1'

networks:
  analytic-net:
    driver: bridge
    external: true

services:
  postgres:
    image: postgres-dbz:15.3
    build:
      context: ./postgres
    container_name: db 
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - analytic-net

  be:
    image: be:latest
    build:
      context: ./be
      # dockerfile: Dockerfile
    container_name: be
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 50M
    ports:
      - 9990:9990
    networks:
      - analytic-net
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - KAFKA_BROKER=${KAFKA_BROKER_DATA_PLATFORM}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
    depends_on:
      - db

  ws:
    image: ws:latest
    build:
      context: ./ws
      dockerfile: Dockerfile
    container_name: ws
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 50M
    ports:
      - 9991:9991
    networks:
      - analytic-net
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER_DATA_PLATFORM}
      - KAFKA_TOPIC=${KAFKA_SINK_TOPIC}
    depends_on:
      - kafka-server
      - be

  fe:
    image: fe:latest
    build:
      context: ./fe
    container_name: fe
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 500M
    environment:
      - VUE_APP_BACKEND_HOST=${VUE_APP_BACKEND_HOST}
      - VUE_APP_WS_HOST=${VUE_APP_WS_HOST}
      - VUE_APP_ANALYTIC_HOST=${VUE_APP_ANALYTIC_HOST}
    ports:
      - 8080:8080
    networks:
      - analytic-net
    depends_on:
      - be 
      - ws 
